name: bdland_pro
description: "Bangladesh Land Survey, Measurement, Mouza CAD, Khatian and Inheritance Flutter Application."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.5
  intl: ^0.19.0
  pdf: ^3.11.1
  printing: ^5.13.2
  geolocator: ^13.0.2
  file_picker: ^10.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/mouza_maps/
    - assets/geo/
    - assets/images/
